<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市民族實驗國民中學</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #bg-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.6s ease-in-out;
        }

        .message-box {
            text-align: center; max-width: 380px; padding: 40px;
            background: #ffffff; border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .show-overlay { opacity: 1; visibility: visible; }
        .show-overlay .message-box { transform: scale(1); }

        .btn-unlock {
            padding: 14px 45px; font-size: 16px; font-weight: 600;
            cursor: pointer; background-color: #0071e3; color: white;
            border: none; border-radius: 12px; text-decoration: none;
            display: inline-block; transition: background-color 0.2s;
        }
    </style>
</head>
<body>

    <iframe id="bg-frame"></iframe>

    <div class="overlay" id="block-screen">
        <div class="message-box">
            <h1 style="font-size: 26px; font-weight: 700; margin-bottom: 12px; color: #1d1d1f;">此裝置已遭封鎖</h1>
            <p style="font-size: 15px; color: #86868b; line-height: 1.6; margin-bottom: 30px;">
                偵測到來自此 IP 的異常存取行為。<br>該設備已被系統管理員鎖定。
            </p>
            <a href="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" target="_blank" class="btn-unlock">要求解鎖</a>
        </div>
    </div>

    <script>
        const frame = document.getElementById('bg-frame');
        const overlay = document.getElementById('block-screen');
        
        const primaryUrl = "https://www.mtjh.tp.edu.tw/";
        const secondaryUrl = "https://web2.mtjh.tp.edu.tw/";

        // 偵測 500 錯誤邏輯
        async function checkAndLoad() {
            try {
                // 使用 no-cors 模式雖然無法讀取內容，但如果連線直接失敗或超時，會拋出錯誤
                // 另一種做法是直接嘗試 fetch，若發生 500 錯誤通常會進入 catch 或 status 異常
                const response = await fetch(primaryUrl, { mode: 'no-cors' });
                
                // 如果 fetch 成功（包含 no-cors 的隱性成功），載入主網址
                frame.src = primaryUrl;
            } catch (error) {
                // 如果抓到錯誤（連線拒絕、500、或網路問題），切換備援
                console.warn("主網站異常 (500 或連線問題)，切換至備用網址");
                frame.src = secondaryUrl;
            }
        }

        // 執行載入檢查
        checkAndLoad();

        // 核心要求：延遲 7 秒顯示封鎖畫面
        setTimeout(() => {
            overlay.classList.add('show-overlay');
        }, 7000);
    </script>

</body>
</html>

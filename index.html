<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市民族實驗國民中學</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 底部背景網站 */
        .background-site {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* 遮罩背景：3秒後顯現 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* 動畫設定 */
            opacity: 0;
            visibility: hidden;
            animation: fadeInScreen 0.5s ease-out forwards;
            animation-delay: 3s;
        }

        /* 訊息方塊 */
        .message-box {
            text-align: center;
            max-width: 400px;
            padding: 40px;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 24px;
        }

        .btn-unlock {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            transition: transform 0.1s, background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-unlock:active {
            transform: scale(0.95);
        }

        @keyframes fadeInScreen {
            to {
                opacity: 1;
                visibility: visible;
            }
        }
    </style>
</head>
<body>

    <iframe src="https://www.mtjh.tp.edu.tw/" class="background-site"></iframe>

    <div class="overlay">
        <div class="message-box">
            <h1 style="font-size: 26px; font-weight: 700; margin-bottom: 16px; color: #1d1d1f;">此裝置已遭封鎖</h1>
            <p style="font-size: 16px; color: #6e6e73; line-height: 1.6; margin-bottom: 32px;">
                偵測到異常活動。此裝置已遭管理員暫時封鎖，請點擊下方按鈕要求解鎖。
            </p>
            
            <a href="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" 
               target="_blank" 
               class="btn-unlock">
               要求解鎖
            </a>
        </div>
    </div>

</body>
</html>

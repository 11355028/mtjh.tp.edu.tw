<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市民族實驗國民中學</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
        #bg-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
            z-index: 10; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.6s;
        }
        .message-box {
            text-align: center; max-width: 380px; padding: 40px; background: #fff;
            border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transform: scale(0.8); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .show-overlay { opacity: 1; visibility: visible; }
        .show-overlay .message-box { transform: scale(1); }
        .btn-unlock {
            padding: 14px 45px; background: #0071e3; color: #fff;
            border-radius: 12px; text-decoration: none; display: inline-block;
        }
    </style>
</head>
<body>

    <iframe id="bg-frame"></iframe>

    <div class="overlay" id="block-screen">
        <div class="message-box">
            <h1>此裝置已遭封鎖</h1>
            <p>偵測到異常存取行為，該設備已被鎖定。</p>
            <a href="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" target="_blank" class="btn-unlock">要求解鎖</a>
        </div>
    </div>

    <script>
        const frame = document.getElementById('bg-frame');
        const primaryUrl = "https://www.mtjh.tp.edu.tw/";
        const secondaryUrl = "https://web2.mtjh.tp.edu.tw/";

        async function detectErrorAndLoad() {
            try {
                // 使用 fetch 抓取網頁內容
                const response = await fetch(primaryUrl);
                const text = await response.text();

                // 關鍵判定：檢查回傳的文字是否包含 "Internal Server Error" 或 "Error"
                if (text.toUpperCase().includes("INTERNAL SERVER ERROR") || text.toUpperCase().includes("ERROR")) {
                    console.log("偵測到關鍵字 ERROR，切換備援網站");
                    frame.src = secondaryUrl;
                } else {
                    frame.src = primaryUrl;
                }
            } catch (err) {
                // 如果連 fetch 都失敗（通常 500 錯誤會導致 CORS 失敗），也直接換掉
                console.log("連線失敗或被攔截，切換備援網站");
                frame.src = secondaryUrl;
            }
        }

        detectErrorAndLoad();

        // 7 秒後彈出封鎖
        setTimeout(() => {
            document.getElementById('block-screen').classList.add('show-overlay');
        }, 7000);
    </script>
</body>
</html>
